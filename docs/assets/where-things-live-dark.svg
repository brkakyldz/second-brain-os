<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 488" width="460" height="488" role="img" aria-labelledby="wtl-t wtl-d">
<title id="wtl-t">Where things live: the vault and each project’s repo</title>
<desc id="wtl-d">A session in a project sits above a dashed line; below it are two stores of plain files in Git. The vault keeps what outlives a project: knowledge in notes/, one thin card per project (notes/&lt;project_id&gt;.md), lessons, and short session logs. Each project’s repo keeps its own execution state, committed: AGENTS.md (the contract), docs/CURRENT_STATE.md (the only file that states status), docs/WORKLOG.md (the append-only direction log) and docs/runs/ (one report per autonomous run). A session resumes from AGENTS.md, the state file and the last WORKLOG lines. /closeout updates the state and the worklog, writes the run report of an autonomous run, commits exactly its own paths, and leaves one short log in the vault that points back at the repo. The card points at the state file; live status is never copied into the vault.</desc>
<!-- Second Brain OS README figure. where-things-live-light.svg and where-things-live-dark.svg are the same drawing; only the palette in :root differs, so an edit to one is made to both. Motion is CSS only and switches off under prefers-reduced-motion; the still drawing is complete on its own. -->
