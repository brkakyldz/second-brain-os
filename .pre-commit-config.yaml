# Optional defense-in-depth layer for anyone who has the `pre-commit`
# framework (https://pre-commit.com) installed locally.
#
# Since v1.1 this is the ONLY secret scan, and only once installed. Until then
# the Node scan in `.claude/hooks/lib.mjs` (`scanStagedForSecrets`) ran inside
# every checkpoint commit; the checkpoint was retired when commits became
# task-owned (ADR 0042, 0044), so nothing scans a commit unless this is enabled.
#
# To enable: `pip install pre-commit && pre-commit install` in this repo.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
